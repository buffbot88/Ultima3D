[project]
name = "ultima3d"
version = "10.0.0"
description = "Ultima3D: agentic 3D asset generator — procedural Blender compiler, live Blender/Godot/GIMP tools, loopback daemon and Freebuff skill bridge."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27.0"]

[project.scripts]
ultima3d = "ultima3d.server:cli"
ultima3d-skill = "ultima3d.skill:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultima3d*"]
