[project]
name = "asset3d"
version = "0.1.0"
description = "Agentic 3D asset generator MCP: AI-directed procedural synthesis in Blender, game-ready output."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]

[project.scripts]
asset3d = "asset3d.server:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asset3d*"]
