name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --manifest-path rust/Cargo.toml
      - name: Unit + parity tests (no Blender/Godot needed)
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host dependencies
        run: python -m pip install "mcp>=2.0" "httpx>=0.27.0"
      - name: Host tests (parity, session budget, skill, daemon, GIMP/Script-Fu)
        run: |
          python tests/parity_test.py
          python tests/session_test.py
          python tests/skill_test.py
          python tests/daemon_test.py
          python tests/gimp_test.py
          python tests/godot_test.py
